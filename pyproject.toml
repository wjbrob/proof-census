[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proof-census"
version = "0.1.0"
description = "Audit Lean 4 projects for axiom hygiene: count the theorems that are actually kernel-clean"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Will Roberts" }]
keywords = ["lean4", "lean", "formal-verification", "theorem-prover", "axioms", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
proof-census = "proof_census.cli:main"

[project.urls]
Homepage = "https://github.com/wjbrob/proof-census"
Issues = "https://github.com/wjbrob/proof-census/issues"

[tool.hatch.build.targets.wheel]
packages = ["proof_census"]

[tool.hatch.build]
artifacts = ["proof_census/audit.lean"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Pin the rule set explicitly: ruff changes its defaults between releases, and CI installs
# the newest version, so an unpinned selection makes the lint step fail on upgrades alone.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR0913"]  # audit_project legitimately takes several keyword options

[tool.ruff.lint.per-file-ignores]
# Asserting against literal expected counts is the whole point of these tests.
"tests/*" = ["PLR2004"]
# main() is a flat sequence of argument handling and reporting branches, not nested logic.
"proof_census/cli.py" = ["PLR0912"]

[tool.pytest.ini_options]
testpaths = ["tests"]
