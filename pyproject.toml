[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proof-census"
version = "0.1.0"
description = "Audit Lean 4 projects for axiom hygiene: count the theorems that are actually kernel-clean"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Will Roberts" }]
keywords = ["lean4", "lean", "formal-verification", "theorem-prover", "axioms", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
proof-census = "proof_census.cli:main"

[project.urls]
Homepage = "https://github.com/wjbrob/proof-census"
Issues = "https://github.com/wjbrob/proof-census/issues"

[tool.hatch.build.targets.wheel]
packages = ["proof_census"]

[tool.hatch.build]
artifacts = ["proof_census/audit.lean"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
