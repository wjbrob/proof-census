name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install the toolchain the fixture pins
        # Run inside the fixture: elan resolves the version from its lean-toolchain file.
        # At the repo root there is no lean-toolchain and no default toolchain, so lake exits 1.
        working-directory: tests/fixture
        run: |
          cat lean-toolchain
          lake --version

      - name: Install the package
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check proof_census tests

      - name: Tests (builds the Lean fixture and audits it end to end)
        run: pytest -v

      - name: CLI smoke test
        run: |
          proof-census --version
          proof-census tests/fixture --names
